name: Atlas Snapshot

# Aktualisiert die Terminal-Daten vor den Claude-Routinen (08:30 und 17:45 Berliner Zeit).
# GitHub-Cron läuft in UTC: je Slot zwei Zeiten für Sommer-/Winterzeit; das Export-Skript
# lässt nur den Lauf durch, der in Berlin ins Zeitfenster fällt, und nur einmal pro Tag.
on:
  schedule:
    - cron: "45 5,6 * * 1-5"   # Morgen-Slot: 07:45 Berlin (Sommer 05:45 UTC, Winter 06:45 UTC)
    - cron: "0 15,16 * * 1-5"  # Abend-Slot:  17:00 Berlin (Sommer 15:00 UTC, Winter 16:00 UTC)
  workflow_dispatch:
    inputs:
      slot:
        description: "manual = sofort ausführen, auto = Zeitfenster prüfen"
        default: manual

permissions:
  contents: write

concurrency:
  group: atlas-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: atlas-terminal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fälligkeit prüfen
        id: due
        run: python -m app.export --check --out ../atlas-snapshot --slot "${{ github.event.inputs.slot || 'auto' }}"

      - name: Abhängigkeiten installieren
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas-terminal/requirements.txt
      - if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: FinBERT-Modell aus Cache
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: finbert-prosusai-v1

      # Datenbank aus dem letzten Lauf: Fällt eine Quelle aus, bleibt der letzte echte Stand erhalten
      - name: Datenbank aus Cache
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: atlas-terminal/atlas.db
          key: atlas-db-${{ github.run_id }}
          restore-keys: atlas-db-

      - name: Tests
        if: steps.due.outputs.run == 'true'
        run: python -m pytest tests -q

      - name: Daten abrufen und Snapshot schreiben
        if: steps.due.outputs.run == 'true'
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          RUN_SCHEDULER: "0"
        run: python -m app.export --out ../atlas-snapshot --slot "${{ github.event.inputs.slot || 'auto' }}"

      - name: Snapshot committen
        if: steps.due.outputs.run == 'true'
        working-directory: .
        run: |
          git config user.name "atlas-snapshot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-snapshot
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Atlas-Snapshot $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "Push fehlgeschlagen" && exit 1
